name: Upload Questions to Firestore

on:
  push:
    branches:
      - main
    paths:
      - 'questions.json'
      - 'uploadQuestions.mjs'
      - '.github/workflows/upload-questions.yml'
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Install Firebase Admin SDK
        run: npm install --no-save firebase-admin

      - name: Run Append-Only Upload Script
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node uploadQuestions.mjs
